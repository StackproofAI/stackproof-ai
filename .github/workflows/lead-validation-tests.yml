name: Lead Validation Engine Tests

on:
  pull_request:
    paths:
      - 'packages/lead-validation-engine/**'
      - '.github/workflows/lead-validation-tests.yml'
  push:
    branches: [main]
    paths:
      - 'packages/lead-validation-engine/**'
      - '.github/workflows/lead-validation-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lead-validation-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Run unit tests
        run: npm test
